services:
  - type: web
    name: work-satthi-api
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    plan: starter
    autoDeployTrigger: off
    disk:
      name: work-satthi-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_PATH
        value: /var/data/work-satthi.db
      - key: CORS_ORIGINS
        value: https://het-darji-1504.github.io,http://localhost:5500,http://127.0.0.1:5500
